    --parchment:#EFE7D2;

    --emerald:#1F4D3D;
    --emerald-light:#2C6B54;
    --emerald-dark:#123028;

    --wine:#7A2E36;
    --ash:#5B6259;
    --line:rgba(18,32,27,0.14);

    --bg:var(--parchment);
    --text:var(--ink);

  }
  html.dark{
    --bg:#12201B;
    --text:#EFE7D2;
    --card:rgba(239,231,210,0.06);
    --line:rgba(239,231,210,0.16);

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    line-height:1.65;
    transition:background .2s ease,color .2s ease;

  h1,h2,h3,.display{font-family:'Cairo',sans-serif;margin:0;}
  a{color:inherit;text-decoration:none;}
  button,select,input{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .tabular{font-variant-numeric:tabular-nums;}

  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(8px);
  }
  .ad-slot{max-width:600px;margin:0 auto;}
  .ad-slot:empty{min-height:0;} /* لا تشغل أي مساحة قبل وضع كود الإعلان */

  .brand{display:flex;align-items:center;gap:9px;font-family:'Cairo',sans-serif;font-weight:800;font-size:1.15rem;color:var(--emerald);letter-spacing:.01em;}
  html.dark .brand{color:var(--gold-light);}
  .nav-links{display:flex;gap:20px;font-size:0.92rem;font-weight:600;}
  .nav-links a:hover{color:var(--gold);}
  .topbtn{
    border:1px solid var(--line);background:transparent;color:var(--text);
    border-radius:999px;padding:7px 14px;font-size:0.85rem;font-weight:600;
    transition:border-color .15s;
  }
  .topbtn:hover{border-color:var(--gold);}
  .topbar-actions{display:flex;gap:8px;align-items:center;}
  @media (max-width:720px){ .nav-links{display:none;} }

  main{max-width:920px;margin:0 auto;padding:0 20px 70px;}

  .hero{
    position:relative;overflow:hidden;
    background:var(--emerald);color:var(--parchment);

      repeating-linear-gradient(65deg, rgba(122,46,54,0.08) 0px, rgba(122,46,54,0.08) 1px, transparent 1px, transparent 14px);
  }
  html.dark .hero{background:#0d1a15;}
  .hero h1{font-size:clamp(2.1rem,6vw,3rem);font-weight:800;line-height:1.2;max-width:640px;margin:0 auto;}
  .hero p{max-width:520px;margin:14px auto 0;color:rgba(239,231,210,0.85);font-size:1.05rem;}
  .live-badge{
    display:inline-flex;flex-direction:column;gap:2px;margin-top:26px;
    border:1px solid rgba(212,175,106,0.4);background:rgba(0,0,0,0.15);
    border-radius:16px;padding:14px 26px;
  }
  .live-badge .lbl{font-size:0.75rem;letter-spacing:.02em;color:rgba(212,175,106,0.85);}
  .live-badge .val{font-family:'Cairo',sans-serif;font-weight:800;font-size:1.6rem;color:var(--gold-light);}
  .hero-cta{
    display:inline-block;margin-top:28px;background:var(--gold);color:var(--ink);
    font-family:'Cairo',sans-serif;font-weight:700;padding:13px 30px;border-radius:999px;
    transition:transform .15s ease;
  }
  .hero-cta:hover{transform:scale(1.05);}

  .entry-wide{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:30px;margin:30px 0 24px;transition:transform .2s,box-shadow .2s;

  .entry-wide:hover, .entry-sq:hover{transform:translateY(-4px);box-shadow:0 18px 30px -18px rgba(18,32,27,0.35);}
  .entry-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:1.4rem;color:var(--emerald);}
  html.dark .entry-title{color:var(--gold-light);}
  .entry-desc{color:var(--ash);margin-top:6px;max-width:420px;}
  .entry-pill{border:1px solid var(--emerald);color:var(--emerald);border-radius:999px;padding:9px 20px;font-weight:700;font-size:0.9rem;white-space:nowrap;}
  html.dark .entry-pill{border-color:var(--gold);color:var(--gold-light);}

  .entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:640px){ .entry-grid{grid-template-columns:1fr;} }
  .entry-sq{
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;
    display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s;
  }

  h1.page-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:1.8rem;color:var(--emerald);margin:36px 0 20px;}
  html.dark h1.page-title{color:var(--gold-light);}

  .controls-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
  .search-input{
    flex:1;min-width:220px;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);

  .search-input:focus{border-color:var(--gold);}
  .base-select-wrap{

  .rate-row{

  .country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .country-card{

    display:flex;flex-direction:column;gap:6px;transition:transform .15s;

  .country-card .flag{font-size:1.8rem;}
  .country-card .name{font-weight:700;font-size:0.95rem;}
  .country-card .cur{font-size:0.75rem;color:var(--ash);}
  .country-card .code-pill{
    margin-top:auto;align-self:flex-start;background:rgba(31,77,61,0.1);color:var(--emerald);
    border-radius:999px;padding:3px 10px;font-size:0.72rem;font-weight:700;
  }

  .info-block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .info-block .lbl{font-size:0.75rem;color:var(--ash);}
  .info-block .val{font-weight:700;margin-top:4px;}

  .converter-card{
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;
    display:flex;flex-direction:column;gap:16px;max-width:480px;margin:24px auto 0;

  .field label{display:block;font-size:0.85rem;margin-bottom:6px;font-weight:600;}
  .field input, .field select{

    background:transparent;color:var(--text);font-size:1.05rem;font-weight:700;

  .field input:focus, .field select:focus{border-color:var(--gold);}
  .swap-btn{
    border:1.5px solid var(--gold);color:var(--gold);background:transparent;border-radius:999px;
    width:44px;height:44px;font-size:1.2rem;margin-bottom:2px;transition:transform .2s;
  }
  .swap-btn:hover{transform:rotate(180deg);}
  .result-box{background:rgba(31,77,61,0.08);border-radius:14px;padding:20px;text-align:center;}
  html.dark .result-box{background:rgba(212,175,106,0.08);}
  .result-box .lbl{font-size:0.85rem;color:var(--ash);}
  .result-box .val{font-family:'Cairo',sans-serif;font-weight:800;font-size:1.9rem;color:var(--emerald);}
  html.dark .result-box .val{color:var(--gold-light);}
  .result-box.multi-result{margin-bottom:10px;}
  .result-box.multi-result .val{font-size:1.4rem;}
  .rate-note{text-align:center;font-size:0.78rem;color:var(--ash);}

  .picker-btn{
    width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);
    background:transparent;color:var(--text);font-size:0.95rem;font-weight:700;text-align:start;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
  }
  .picker-btn:hover{border-color:var(--gold);}
  .picker-panel{
    background:var(--card);border:1.5px solid var(--gold);border-radius:16px;padding:14px;
    display:flex;flex-direction:column;gap:10px;
  }
  .picker-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
  .picker-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 12px;border-radius:10px;border:1px solid var(--line);cursor:pointer;transition:background .15s;
  }
  .picker-row:hover{border-color:var(--gold);}
  .picker-row-selected{background:rgba(31,77,61,0.1);border-color:var(--emerald);}
  html.dark .picker-row-selected{background:rgba(212,175,106,0.12);border-color:var(--gold);}
  .picker-row-main{display:flex;align-items:center;gap:10px;min-width:0;}
  .picker-code{font-weight:800;font-family:'Cairo',sans-serif;color:var(--emerald);}
  html.dark .picker-code{color:var(--gold-light);}
  .picker-name{font-size:0.85rem;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .picker-check{color:var(--emerald);font-weight:800;}
  html.dark .picker-check{color:var(--gold-light);}
  .picker-done{
    align-self:center;border:1.5px solid var(--emerald);color:var(--emerald);background:transparent;
    border-radius:999px;padding:9px 26px;font-weight:700;
  }
  html.dark .picker-done{border-color:var(--gold);color:var(--gold-light);}
  .picker-done:hover{background:rgba(31,77,61,0.08);}
  html.dark .picker-done:hover{background:rgba(212,175,106,0.1);}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);
    border-radius:999px;padding-inline-start:14px;padding-inline-end:6px;padding-block:6px;
    font-weight:800;font-family:'Cairo',sans-serif;font-size:0.9rem;color:var(--emerald);
  }
  html.dark .chip{color:var(--gold-light);}
  .chip-remove{
    border:none;background:rgba(122,46,54,0.12);color:var(--wine);border-radius:999px;
    width:20px;height:20px;font-size:0.85rem;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .chip-remove:hover{background:rgba(122,46,54,0.22);}
  .chip-add{
    width:38px;height:38px;border-radius:999px;border:1.5px dashed var(--gold);color:var(--gold);
    background:transparent;font-size:1.3rem;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  html.dark .chip-add{color:var(--gold-light);border-color:var(--gold-light);}
  .chip-add:hover{background:rgba(180,137,63,0.1);}

  .image-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:14px;}
  .gallery-subtitle{font-family:'Cairo',sans-serif;font-weight:700;font-size:1rem;color:var(--ash);margin:22px 0 4px;}
  .image-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;margin-top:0;}
  .image-box img{max-height:200px;max-width:100%;border-radius:12px;object-fit:contain;cursor:zoom-in;display:block;margin:0 auto;}
  .image-unavailable{
    border:1.5px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--ash);margin-top:14px;
  }
  .wiki-link{color:var(--gold);text-decoration:underline;font-size:0.85rem;display:inline-block;margin-top:10px;}

  .lightbox{
    position:fixed;inset:0;z-index:100;background:rgba(18,32,27,0.85);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .lightbox img{max-height:80vh;max-width:100%;border-radius:10px;}
  .lightbox-close{display:block;width:100%;max-width:520px;margin:14px auto 0;background:var(--parchment);color:var(--ink);border:none;border-radius:999px;padding:10px;font-weight:700;}

  .loading, .error-box{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    border:1px solid var(--line);border-radius:14px;padding:34px 20px;text-align:center;color:var(--ash);
  }
  .error-box{border-color:rgba(122,46,54,0.3);background:rgba(122,46,54,0.05);color:var(--wine);}
  .spinner{width:20px;height:20px;border-radius:999px;border:3px solid var(--gold);border-top-color:transparent;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .retry-btn{border:1px solid var(--wine);color:var(--wine);background:transparent;border-radius:999px;padding:8px 18px;font-weight:700;}

  .back-link{display:inline-block;margin-top:20px;color:var(--ash);font-size:0.9rem;}
  .back-link:hover{color:var(--gold);}

  footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:var(--ash);font-size:0.78rem;}
</style>

function fallbackRatesFor(base){
  const baseRate = FALLBACK_RATES_USD[base];
  if(!baseRate) return null;
  const rates = {};
  Object.keys(FALLBACK_RATES_USD).forEach(code=>{
    rates[code] = FALLBACK_RATES_USD[code] / baseRate;
  });
  return { rates, updatedAt: FALLBACK_SNAPSHOT_DATE, offline:true };
}

function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const id = setTimeout(()=>controller.abort(), ms || 7000);
  return fetch(url, { signal: controller.signal }).finally(()=>clearTimeout(id));
}

/* ---------- Data layer ----------
   Always tries the live source first. Only if that fails (no internet, the
   browser blocks the request, or the source is unreachable) do we fall back
   to the embedded offline snapshot above — and every view that uses it shows
   a visible "offline / approximate" notice, so real and fallback data are
   never confused with each other. */

async function ensureCountries(){
  if(state.countries.data || state.countries.loading) return;
  state.countries.loading = true;
  try{
    const res = await fetchWithTimeout('https://restcountries.com/v3.1/all?fields=name,cca2,region,subregion,flag,currencies,translations', 7000);
    if(!res.ok) throw new Error('bad_status');
    const json = await res.json();
    const list = json.map(raw=>{
      const entries = raw.currencies ? Object.entries(raw.currencies) : [];
      const [code, info] = entries[0] || [null,null];
      return {
        code: raw.cca2,
        nameAr: (raw.translations && raw.translations.ara && raw.translations.ara.common) || raw.name.common,
        nameEn: raw.name.common,
        region: raw.region, subregion: raw.subregion,
        flagEmoji: raw.flag,
        currencyCode: code, currencyName: info ? info.name : null, currencySymbol: info ? info.symbol : null
      };
    }).filter(c=>c.code && c.currencyCode).sort((a,b)=>(a.nameEn||'').localeCompare(b.nameEn||''));
    state.countries = { data:list, error:null, loading:false, offline:false };
  }catch(err){
    state.countries = { data:FALLBACK_COUNTRIES, error:null, loading:false, offline:true };
  }
  render();
}

async function ensureRates(base){
  const entry = state.ratesCache[base];
  if(entry && (entry.data || entry.loading)) return;
  state.ratesCache[base] = { data:null, error:null, loading:true };
  try{
    const res = await fetchWithTimeout('https://open.er-api.com/v6/latest/'+encodeURIComponent(base), 7000);
    if(!res.ok) throw new Error('bad_status');
    const json = await res.json();
    if(!json.rates) throw new Error('shape');
    state.ratesCache[base] = { data:{ rates:json.rates, updatedAt:json.time_last_update_utc, offline:false }, error:null, loading:false };
  }catch(err){
    const fb = fallbackRatesFor(base);
    if(fb) state.ratesCache[base] = { data:fb, error:null, loading:false };
    else state.ratesCache[base] = { data:null, error:'network', loading:false };
  }
  render();
}

// نقرأ مقال ويكيبيديا الخاص بالعملة بعناوينه الفرعية، ونستبعد كليًا أي صور تقع
// تحت عناوين تخص الإصدارات القديمة/التاريخية (Former, Withdrawn, History...)،
// بحيث لا تظهر إلا صور الفئات الحالية المتداولة الآن. كما نُعطي أولوية لصور
// الإنفوبوكس (الصور التي اختارها محررو ويكيبيديا أنفسهم لتمثيل العملة) ونحدّ
// العدد الإجمالي لصورة مختارة بعناية بدل قائمة طويلة غير منسّقة.
const IMG_EXCLUDE_RE = /commons-logo|wiktionary|wikisource|wikiquote|wikinews|wikivoyage|wikibooks|wikidata|edit-icon|question_book|ambox|padlock|folder|symbol_|ooui|nuvola|crystal_clear|flag_of|coat_of_arms|loudspeaker|semi-protection|protection-|blue_pencil|magnify-clip|red_x|green_tick|wikimedia-logo|globe-|disambig|wiki_letter|100_percent|icon_|pictogram|edit-clear/i;

const SECTION_EXCLUDE_RE = /see also|reference|external link|further reading|bibliograph|footnote|citation needed|^notes$|former|\bold\b|previous|withdrawn|discontinu|demoneti[sz]|obsolete|historical|\bhistory\b|predecessor|replaced|retired|first series|earlier/i;

function isSectionExcluded(headingText){
  if(!headingText) return false; // صور المقدمة/الإنفوبوكس بلا عنوان تمثّل العملة الحالية
  return SECTION_EXCLUDE_RE.test(headingText.toLowerCase());
}

const MAX_CURRENCY_IMAGES = 6; // نكتفي بعدد محدود من الصور المنتقاة بعناية بدل تفريغ كل صور المقال

async function fetchArticleParsedHtml(title){
  const pp = new URLSearchParams({
    action:'parse', page:title, format:'json', formatversion:'2',
    prop:'text', redirects:'1', disabletoc:'1', origin:'*'
  });
  const res = await fetchWithTimeout('https://en.wikipedia.org/w/api.php?'+pp.toString(), 9000);
  if(!res.ok) throw new Error('parse_failed');
  const json = await res.json();
  if(!json.parse || !json.parse.text) throw new Error('parse_empty');
  return json.parse.text;
}

function extractSectionImages(htmlText, title){
  const wrap = document.createElement('div');
  wrap.innerHTML = htmlText;
  const root = wrap.querySelector('.mw-parser-output') || wrap;

  const sections = [];
  let current = { heading:null, els:[] };
  sections.push(current);

  Array.from(root.children).forEach(el=>{
    const headingEl = /^H[2-6]$/.test(el.tagName) ? el
      : (el.querySelector ? el.querySelector(':scope > h2, :scope > h3, :scope > h4, :scope > h5, :scope > h6') : null);
    if(headingEl){
      current = { heading: headingEl.textContent.replace(/\[edit\]/gi,'').trim(), els: [] };
      sections.push(current);
    } else {
      current.els.push(el);
    }
  });

  const picked = []; // {item, priority}
  const seen = new Set();

  sections.forEach(sec=>{
    if(isSectionExcluded(sec.heading)) return; // نتجاهل القسم بالكامل (قديم/غير ذي صلة)
    sec.els.forEach(el=>{
      const inInfobox = !!(el.matches && (el.matches('.infobox') || el.querySelector('.infobox')));
      const imgs = el.querySelectorAll ? el.querySelectorAll('img') : [];
      imgs.forEach(img=>{
        const src = img.getAttribute('src') || '';
        if(!src) return;
        const full = src.startsWith('//') ? 'https:'+src : src;
        if(IMG_EXCLUDE_RE.test(full)) return;
        if(/\.svg(\?|$)/i.test(full)) return;
        const w = parseInt(img.getAttribute('width')||'0', 10);
        if(w && w < 100) return;
        if(seen.has(full)) return;
        seen.add(full);
        const bigger = full.replace(/\/(\d+)px-/, '/500px-');
        let pageUrl = 'https://en.wikipedia.org/wiki/'+encodeURIComponent(title.replace(/ /g,'_'));
        const link = img.closest('a[href^="/wiki/File:"]');
        if(link) pageUrl = 'https://en.wikipedia.org'+link.getAttribute('href');
        const item = { title: (img.getAttribute('alt')||'').trim() || title, imageUrl: bigger, pageUrl };
        // نعطي الأولوية لصور الإنفوبوكس (اختيار محرري ويكيبيديا) ثم لصور مقدمة المقال، ثم البقية
        const priority = inInfobox ? 0 : (sec.heading===null ? 1 : 2);
        picked.push({ item, priority });
      });
    });
  });

  picked.sort((a,b)=>a.priority-b.priority);
  return picked.slice(0, MAX_CURRENCY_IMAGES).map(p=>p.item);
}

// احتياط أول: قائمة صور مسطّحة بلا تصنيف أقسام، إن تعذّرت قراءة الأقسام.
async function fetchArticleImagesFlat(title){
  const ip = new URLSearchParams({
    action:'query', titles:title, generator:'images', gimlimit:'50',
    prop:'imageinfo', iiprop:'url|size', iiurlwidth:'500',
    format:'json', origin:'*'
  });
  const res = await fetchWithTimeout('https://en.wikipedia.org/w/api.php?'+ip.toString(), 8000);
  if(!res.ok) throw new Error('images_failed');
  const json = await res.json();
  const pages = json.query && json.query.pages ? Object.values(json.query.pages) : [];
  return pages.map(p=>{
    const info = p.imageinfo && p.imageinfo[0];
    if(!info || !info.url) return null;
    const fname = p.title || '';
    if(IMG_EXCLUDE_RE.test(fname)) return null;
    if(/\.svg$/i.test(fname)) return null;
    if(info.width && info.width < 120) return null;
    return {
      title: fname.replace(/^File:/,'').replace(/\.[a-zA-Z0-9]+$/,''),
      imageUrl: info.thumburl || info.url,
      pageUrl: 'https://en.wikipedia.org/wiki/'+encodeURIComponent(title.replace(/ /g,'_'))
    };
  }).filter(Boolean).slice(0, MAX_CURRENCY_IMAGES);
}

async function ensureCurrencyImages(currencyName){
  if(!currencyName) return;
  if(state.imageCache[currencyName]) return;
  state.imageCache[currencyName] = 'loading';
  try{
    const sp = new URLSearchParams({ action:'opensearch', search:currencyName, limit:'1', namespace:'0', format:'json', origin:'*' });
    const sres = await fetchWithTimeout('https://en.wikipedia.org/w/api.php?'+sp.toString(), 7000);
    if(!sres.ok) throw new Error('search_failed');
    const sjson = await sres.json();
    const title = sjson[1] && sjson[1][0];
    if(!title){ state.imageCache[currencyName] = { images: [] }; render(); return; }

    let images = await fetchArticleParsedHtml(title)
      .then(html => extractSectionImages(html, title))
      .catch(() => []);

    // احتياط ثانٍ: لو تعذّرت قراءة الأقسام أو خرجت فارغة، نجرّب قائمة الصور المسطّحة.
    if(images.length===0){
      images = await fetchArticleImagesFlat(title).catch(()=>[]);
    }

    // احتياط أخير: صورة رئيسية واحدة على الأقل بدل رسالة "غير متوفرة".
    if(images.length===0){
      const pres = await fetchWithTimeout('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title.replace(/ /g,'_')), 7000);
      if(pres.ok){
        const pjson = await pres.json();
        const mainUrl = (pjson.originalimage && pjson.originalimage.source) || (pjson.thumbnail && pjson.thumbnail.source) || null;
        if(mainUrl){
          images = [{
            title,
            imageUrl: mainUrl,
            pageUrl: (pjson.content_urls && pjson.content_urls.desktop && pjson.content_urls.desktop.page) || 'https://en.wikipedia.org/wiki/'+encodeURIComponent(title.replace(/ /g,'_'))
          }];
        }
      }
    }

    state.imageCache[currencyName] = { images };
  }catch(err){
    state.imageCache[currencyName] = { images: [] };
  }
  render();
}

  else if(r.error) body = errorHtml(t('errorRates'),'rates');
  else body = `
    <div class="field">
      <label>${t('amount')}</label>
      <input type="number" min="0" id="convAmount" value="${state.convAmount}">
    </div>
    <div class="field">
      <label>${t('from')}</label>
      <button type="button" class="picker-btn" id="convFromBtn">${state.convFrom} — ${nameFor(state.convFrom)} ▾</button>
    </div>
    <div class="field">
      <label>${t('to')}</label>
      ${convToChipsHtml()}
    </div>
    ${state.picker ? pickerPanelHtml(state.picker.mode) : ''}
    <div id="convResultWrap">${converterResultHtml()}</div>
  `;

  return `<main>
    <h1 class="page-title">${t('navConverter')}</h1>
    ${(c.offline || (r.data && r.data.offline)) ? offlineBadge(FALLBACK_SNAPSHOT_DATE) : ''}
    <div class="converter-card">${body}</div>
    <!-- نقطة تثبيت فارغة فقط — لا تلصق أي كود هنا -->
    <div id="ad-anchor-converter"></div>
  </main>`;
}

function countriesResultsHtml(){
  const c = state.countries;
  let list = c.data || [];
  const q = state.countriesQuery.trim().toLowerCase();
  if(q) list = list.filter(x=>[x.nameAr,x.nameEn,x.currencyCode,x.currencyName].filter(Boolean).some(f=>f.toLowerCase().includes(q)));

  let body;
  if(c.loading) body = loadingHtml();
  else if(c.error) body = errorHtml(t('errorCountries'),'countries');
  else if(list.length===0) body = `<p style="text-align:center;color:var(--ash);padding:40px 0;">${t('noResults')}</p>`;
  else body = `<div class="country-grid">${list.map(country=>{
    const name = state.lang==='ar'?country.nameAr:country.nameEn;
    return `<a href="#/country/${country.code}" class="country-card">
      <span class="flag">${country.flagEmoji||''}</span>
      <span class="name">${name}</span>
      <span class="cur">${country.currencyName||''}</span>
      <span class="code-pill">${country.currencyCode}</span>
    </a>`;
  }).join('')}</div>`;

  return `
    ${c.offline ? offlineBadge(FALLBACK_SNAPSHOT_DATE) : ''}
    ${body}
  `;
}

function renderCountries(){
  ensureCountries();
  return `<main>
    <h1 class="page-title">${t('allCountries')}</h1>
    <div class="controls-row"><input class="search-input" id="countriesSearch" placeholder="${t('searchPlaceholder')}" value="${state.countriesQuery.replace(/"/g,'&quot;')}"></div>
    <div id="countriesResultsWrap">${countriesResultsHtml()}</div>
    <!-- نقطة تثبيت فارغة فقط — لا تلصق أي كود هنا -->
    <div id="ad-anchor-countries"></div>
  </main>`;
}

function renderCountryDetail(code){
  ensureCountries();
  const c = state.countries;
  let country = null;
  if(c.data) country = c.data.find(x=>x.code===code);

  if(c.loading) return `<main>${loadingHtml()}</main>`;
  if(c.error) return `<main>${errorHtml(t('errorCountries'),'countries')}</main>`;
  if(!country) return `<main>${errorHtml(t('errorCountries'),'countries')}</main>`;

  ensureCurrencyImages(country.currencyName);
  const img = state.imageCache[country.currencyName];
  const name = state.lang==='ar'?country.nameAr:country.nameEn;

  let imageSection;
  if(!img || img==='loading') imageSection = loadingHtml();
  else if(img.images && img.images.length){
    imageSection = `<div class="image-gallery">
      ${img.images.map(im=>`
        <div class="image-box">
          <img src="${im.imageUrl}" alt="${t('imageFromWikipedia')} ${country.currencyName}" class="cur-img">
          <a class="wiki-link" href="${im.pageUrl}" target="_blank" rel="noopener noreferrer">${t('openWikipedia')} ↗</a>
        </div>`).join('')}
    </div>`;
  }
  else imageSection = `<div class="image-unavailable">${t('imageUnavailable')}</div>`;

  return `<main>
    <a href="#/countries" class="back-link">← ${t('allCountries')}</a>
    <div style="display:flex;align-items:center;gap:16px;margin-top:14px;">
      <span style="font-size:3rem;">${country.flagEmoji||''}</span>
      <div>
        <h1 style="font-family:'Cairo',sans-serif;font-weight:800;font-size:1.7rem;color:var(--emerald);">${name}</h1>
        <div style="color:var(--ash);">${country.region||''}${country.subregion?' · '+country.subregion:''}</div>
      </div>
    </div>
    ${c.offline ? offlineBadge(FALLBACK_SNAPSHOT_DATE) : ''}
    <div class="info-grid">
      <div class="info-block"><div class="lbl">${t('officialCurrency')}</div><div class="val">${country.currencyName||'—'}</div></div>
      <div class="info-block"><div class="lbl">${t('isoCode')}</div><div class="val">${country.currencyCode||'—'}</div></div>
      <div class="info-block"><div class="lbl">${t('symbol')}</div><div class="val">${country.currencySymbol||'—'}</div></div>
      <div class="info-block"><div class="lbl">${t('region')}</div><div class="val">${country.region||'—'}</div></div>
    </div>
    <h2 style="font-family:'Cairo',sans-serif;font-weight:800;font-size:1.3rem;margin-top:30px;color:var(--emerald);">${t('realImages')}</h2>
    ${imageSection}
  </main>`;
}

/* ---------- Router / bootstrap ---------- */

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(parts.length===0) return {page:'home'};
  if(parts[0]==='rates') return {page:'rates'};
  if(parts[0]==='converter') return {page:'converter'};
  if(parts[0]==='countries') return {page:'countries'};
  if(parts[0]==='country' && parts[1]) return {page:'country', code:parts[1]};
  return {page:'home'};
}

// مساحات الإعلان الحقيقية (ad-real-*) عناصر HTML ثابتة تعيش خارج هذا الكود بالكامل
// (انظر أعلى الملف، قبل بداية هذا الوسم البرمجي)، وهذا مقصود ومهم: إن كان كود
// الإعلان يحتوي بنفسه على وسم إغلاق سكريبت، ولصقناه كنص داخل سلسلة نصية ضمن
// كودنا هنا، فسيقرأ المتصفح أول وسم إغلاق يجده — حتى لو كان بداخل نص برمجي —
// على أنه نهاية كود الموقع نفسه، فيتعطل كل شيء بعده. لذلك لا ننشئ عناصر الإعلان
// عبر innerHTML إطلاقًا، بل ننقل (move) العنصر الثابت الجاهز مسبقًا إلى نقطة
// التثبيت الفارغة الخاصة بالصفحة الحالية باستخدام appendChild، وهذا آمن تمامًا
// أيًا كان محتواه.
function positionAds(route){
  const map = {
    home: 'ad-anchor-home', rates: 'ad-anchor-rates',
    converter: 'ad-anchor-converter', countries: 'ad-anchor-countries'
  };
  const realMap = {
    home: 'ad-real-home', rates: 'ad-real-rates',
    converter: 'ad-real-converter', countries: 'ad-real-countries'
  };
  const anchorId = map[route.page];
  const realIdFor = realMap[route.page];
  if(!anchorId || !realIdFor) return;
  const anchor = document.getElementById(anchorId);
  const real = document.getElementById(realIdFor);
  if(anchor && real) anchor.appendChild(real);
}

function render(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = I18N[state.lang].dir;
  document.documentElement.classList.toggle('dark', state.theme==='dark');
  document.title = t('siteName');

  const route = parseHash();
  let pageHtml;
  if(route.page==='home') pageHtml = renderHome();
  else if(route.page==='rates') pageHtml = renderRates();
  else if(route.page==='converter') pageHtml = renderConverter();
  else if(route.page==='countries') pageHtml = renderCountries();
  else if(route.page==='country') pageHtml = renderCountryDetail(route.code);
  else pageHtml = renderHome();

  const appEl = document.getElementById('app');
  appEl.innerHTML = topbar() + pageHtml + footerHtml() + (state.lightbox?lightboxHtml():'');
  positionAds(route);
  attachEvents(route);
}

function lightboxHtml(){
  return `<div class="lightbox" id="lightboxOverlay">
    <div>
      <img src="${state.lightbox.src}" alt="${state.lightbox.alt}">
      <button class="lightbox-close" id="lightboxClose">${t('closeImage')}</button>
    </div>
  </div>`;
}

function attachEvents(route){
  const themeBtn = document.getElementById('themeBtn');
  if(themeBtn) themeBtn.addEventListener('click', ()=>{
    state.theme = state.theme==='dark'?'light':'dark';
    localStorage.setItem('ca_theme', state.theme);
    render();
  });
  const langBtn = document.getElementById('langBtn');
  if(langBtn) langBtn.addEventListener('click', ()=>{
    state.lang = state.lang==='ar'?'en':'ar';
    localStorage.setItem('ca_lang', state.lang);
    render();
  });

  document.querySelectorAll('[data-retry]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kind = btn.dataset.retry;
      if(kind==='countries'){ state.countries = {data:null,error:null,loading:false}; ensureCountries(); }
      if(kind==='rates'){
        const base = route.page==='converter' ? state.convFrom : state.ratesBase;
        state.ratesCache[base] = null;
        ensureRates(base);
      }
      render();
    });
  });

  if(route.page==='rates'){
    const s = document.getElementById('ratesSearch');
    if(s){ s.addEventListener('input', e=>{
      state.ratesQuery = e.target.value;
      const wrap = document.getElementById('ratesResultsWrap');
      if(wrap) wrap.innerHTML = ratesResultsHtml();
    }); }
    const b = document.getElementById('ratesBaseSelect');
    if(b) b.addEventListener('change', e=>{ state.ratesBase = e.target.value; render(); });
  }

  if(route.page==='countries'){
    const s = document.getElementById('countriesSearch');
    if(s){ s.addEventListener('input', e=>{
      state.countriesQuery = e.target.value;
      const wrap = document.getElementById('countriesResultsWrap');
      if(wrap) wrap.innerHTML = countriesResultsHtml();
    }); }
  }

  if(route.page==='converter'){
    const a = document.getElementById('convAmount');
    if(a) a.addEventListener('input', e=>{
      state.convAmount = e.target.value;
      const wrap = document.getElementById('convResultWrap');
      if(wrap) wrap.innerHTML = converterResultHtml();
    });

    const fromBtn = document.getElementById('convFromBtn');
    if(fromBtn) fromBtn.addEventListener('click', ()=>{
      state.picker = { mode:'from', query:'' };
      render();
    });

    const addBtn = document.getElementById('convAddBtn');
    if(addBtn) addBtn.addEventListener('click', ()=>{
      state.picker = { mode:'add', query:'' };
      render();
    });

    // إزالة عملة عبر × على الشريط، مباشرة بدون فتح أي لوحة.
    document.querySelectorAll('.chip-remove').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const code = btn.getAttribute('data-remove');
        const idx = state.convToList.indexOf(code);
        if(idx>=0) state.convToList.splice(idx,1);
        render();
      });
    });

    const pickerSearch = document.getElementById('pickerSearch');
    if(pickerSearch && state.picker) pickerSearch.addEventListener('input', e=>{
      state.picker.query = e.target.value;
      const list = document.getElementById('pickerList');
      if(list) list.innerHTML = pickerListHtml(state.picker.mode);
    });

    // نقرة واحدة فقط تُنهي العملية: تختار عملة "from" أو تضيف عملة إلى "to"، وتُغلق اللوحة فورًا.
    const pickerList = document.getElementById('pickerList');
    if(pickerList && state.picker) pickerList.addEventListener('click', e=>{
      const row = e.target.closest('.picker-row');
      if(!row) return;
      const code = row.getAttribute('data-code');
      if(state.picker.mode==='from'){
        state.convFrom = code;
      } else {
        if(!state.convToList.includes(code)) state.convToList.push(code);
      }
      state.picker = null;
      render();
    });

    const pickerDone = document.getElementById('pickerDone');
    if(pickerDone) pickerDone.addEventListener('click', ()=>{ state.picker = null; render(); });
  }

  if(route.page==='country'){
    document.querySelectorAll('.cur-img').forEach(img=>{
      img.addEventListener('click', ()=>{
        state.lightbox = { src: img.src, alt: img.alt };
        render();
      });
    });
  }

  const lb = document.getElementById('lightboxOverlay');
  if(lb){
    lb.addEventListener('click', ()=>{ state.lightbox=null; render(); });
    const closeBtn = document.getElementById('lightboxClose');
    if(closeBtn) closeBtn.addEventListener('click', (e)=>{ e.stopPropagation(); state.lightbox=null; render(); });
  }
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
